<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CI/CD Assignment 3 - FA23-BSE-106</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; }
    .card { max-width: 640px; margin: 40px auto; background: #fff; padding: 28px 32px;
            border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h1 { color: #1f4e79; margin-top: 0; }
    button { background: #1f4e79; color: #fff; border: 0; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
    input { padding: 7px; width: 60%; border: 1px solid #aab; border-radius: 5px; }
    .out { color: #146c2e; font-weight: bold; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="main-heading">Manually Uploaded Website</h1>
    <p id="student">Name: Muhammad Hassam Raza</p>
    <p id="roll">Roll Number: FA23-BSE-106</p>

    <button id="show-btn" onclick="document.getElementById('message').textContent = 'Selenium tests passed and the site was deployed!'">Show Message</button>
    <p id="message" class="out"></p>

    <form id="text-form" onsubmit="event.preventDefault(); document.getElementById('output').textContent = 'You entered: ' + document.getElementById('text-input').value;">
      <input id="text-input" type="text" placeholder="Type something">
      <button id="submit-btn" type="submit">Submit</button>
    </form>
    <p id="output" class="out"></p>
  </div>
</body>
</html>
